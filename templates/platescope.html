<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlateScope · 薄层色谱读板</title>
  <link rel="stylesheet" href="/static/platescope.css">
  <script src="/static/platescope.js" defer></script>
</head>
<body>
<header class="masthead">
  <div class="brand"><strong>PlateScope</strong><span>薄层色谱读板</span></div>
  <a href="/prepare">照片准备 ↗</a>
</header>
<main>
  <aside class="catalog">
    <h2>照片库</h2>
    <button id="upload" class="primary">导入照片</button>
    <button id="demo">载入练习板</button>
    <input id="file" type="file" accept="image/png,image/jpeg,image/tiff" hidden>
    <div id="library" class="items"></div>
    <h2 class="records-title">读板记录</h2>
    <div id="saved" class="items"></div>
  </aside>
  <section class="workspace" aria-label="板照与标定">
    <header class="workspace-title">
      <div><h1 id="title">色谱板照片</h1><p id="source-info">从照片库打开照片。</p></div>
      <label class="mark-toggle"><input type="checkbox" id="marks" checked> 显示标记</label>
    </header>
    <div class="photo-stage">
      <p id="empty">导入一张展开方向朝上的色谱板照片。</p>
      <canvas id="photo" aria-label="色谱板原片与读数标记" hidden></canvas>
    </div>
    <div class="tools" aria-label="照片工具">
      <button type="button" data-tool="roi" disabled>框选板区</button>
      <button type="button" data-tool="front" disabled>设溶剂前沿</button>
      <button type="button" data-tool="origin" disabled>设起跑线</button>
      <span id="position"></span>
    </div>
    <form id="settings">
      <fieldset id="inputs" disabled>
        <legend>标定与读数</legend>
        <div class="input-grid">
          <label>泳道数 <input name="lanes" type="number" min="1" max="12" step="1" required></label>
          <label>当前道 <input name="lane" type="number" min="1" max="12" step="1" required></label>
          <label>参照道 <input name="reference" type="number" min="1" max="12" step="1" required></label>
          <label>显色通道 <select name="channel" id="channel"></select></label>
          <label>显色阈值 <input name="cutoff" type="number" min="0.01" max=".95" step=".001" required></label>
          <label>最小带高 (px) <input name="min_height" type="number" min="1" max="200" step="1" required></label>
          <label>Rf 容差 <input name="tolerance" type="number" min="0" max=".5" step=".001" required></label>
          <label>样品带序号 <input name="sample_band" type="number" min="1" max="128" step="1" required></label>
          <label>参照带序号 <input name="reference_band" type="number" min="1" max="128" step="1" required></label>
        </div>
        <div class="actions">
          <button id="run" type="submit">重算</button>
          <button id="apply" type="button">保留标定</button>
          <button id="save" type="button" class="primary">保存读板</button>
        </div>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="report" aria-label="读板结果">
    <div id="modes" class="modes" aria-label="读数类型"></div>
    <header class="result-head">
      <h2 id="result-title">读数</h2><span id="result-state"></span>
    </header>
    <div id="metrics" class="metrics"></div>
    <section id="plot-box" hidden>
      <h3 id="plot-title"></h3>
      <canvas id="plot" width="560" height="172" aria-label="显色沿 Rf 的变化"></canvas>
      <p id="sample-read"></p>
    </section>
    <div id="rows" class="readings"></div>
    <div class="downloads">
      <a id="csv" download hidden>下载 CSV</a>
      <a id="png" download hidden>下载标记 PNG</a>
    </div>
  </section>
</main>
</body>
</html>
