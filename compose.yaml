name: solo86-platescope
services:
  desk:
    build:
      context: .
      args:
        PLATESCOPE_RUNTIME_IMAGE: ${PLATESCOPE_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${PLATESCOPE_IMAGE:-solo86-platescope:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${PLATESCOPE_PORT:-19886}:8000"
    volumes:
      - plate-library:/var/lib/platescope
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/tlc/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  plate-library:
